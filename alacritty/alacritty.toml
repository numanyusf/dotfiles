general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[selection]
save_to_clipboard = true

[mouse]
# Hide the mouse cursor while typing.
hide_when_typing = true
# Note: single/double/triple click and drag-select are built-in and not
# configurable; Ctrl+click on a URL opens it via the default hint.
bindings = [
# Right-click pastes the clipboard (selections land there via save_to_clipboard).
{ mouse = "Right", action = "Paste" },
# Shift+Right pastes the primary/selection buffer instead.
{ mouse = "Right", mods = "Shift", action = "PasteSelection" },
# Middle-click pastes the primary/selection buffer (explicit default).
{ mouse = "Middle", action = "PasteSelection" }
]

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]
