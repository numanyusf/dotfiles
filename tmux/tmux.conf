# Truecolor passthrough — Ptyxis and everything running inside it (oh-my-posh,
# Neovim) use 24-bit RGB; without this tmux degrades to 256 colors.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:Tc"

set -g mouse on
set -sg escape-time 10        # avoids Esc-key lag in Neovim (default 500ms)
set -g focus-events on        # lets Neovim detect focus in/out inside tmux
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1

# Colors — matches ptyxis/one-warm.palette (Ptyxis "One (Warm)", Atom One Dark)
set -g status-style "bg=#1E2127,fg=#D6D2C4"
set -g window-status-current-style "bg=#61AFEF,fg=#1E2127,bold"   # terminal Color4
set -g window-status-style "bg=#1E2127,fg=#5C6370"                # terminal Color8
set -g pane-border-style "fg=#5C6370"                              # terminal Color8
set -g pane-active-border-style "fg=#61AFEF"                       # terminal Color4
set -g message-style "bg=#61AFEF,fg=#1E2127"

set -g status-left ""
set -g status-right "#[fg=#5C6370]%Y-%m-%d %H:%M "
